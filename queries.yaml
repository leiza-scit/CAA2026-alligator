# Source of truth for the interactive query page.
#
#   queries.yaml -> py/build_sparql.py -> docs/sparql.html            (browser)
#                                      -> docs/downloads/queries/*.rq (plain files)
#                                      -> qmd/<name>.qmd              (quarto-live)
#
# Every query below is executed against the real graph at build time. A query
# that returns no rows fails the build: SPARQL does not error on a mistyped IRI,
# it returns nothing, so an empty result is the ordinary symptom of a broken
# graph rather than of a boring question.

graph:
  file: output/arretine_sites_minigraph.ttl   # repo-relative, verified at build time
  url: arretine_sites_minigraph.ttl           # how the browser reaches it, from docs/
  publish: true                               # copy it into docs/

  # Extra graphs, loaded by a query that declares `needs: <key>`. A `file:` marks
  # one this repository builds itself: it is verified from disk at build time
  # rather than fetched from the published URL, so a change to the modelling
  # fails the build now instead of a release later.
  extra:
    services:
      file: output/arretine_services.ttl
      url: arretine_services.ttl
      publish: true
      label: "service-type counts"
      note: "1208 triples, built by py/services_to_rdf.py from the workbook"

page:
  title: "Query the Arretine chronology graph"
  intro: >-
    The graph behind the CAA 2026 contribution: 45 Arretine ware findspots in the
    north-western Roman provinces, each with a dated interval, grouped both by
    the seriation output and by archaeological horizon. Every query below runs in
    your browser — edit them and press Run.
  vocabulary_note: >-
    Vocabularies: CIDOC-CRM, OWL-Time, GeoSPARQL, SKOS and
    <code>lado:</code> (archaeology.link). Findspots link to Wikidata and Pleiades.
  nav:
    - {href: "index.html", label: "Overview"}
    - {href: "sparql.html", label: "Query", active: true}

qmd:
  file: arretine-chronology-sparql-live.qmd
  title: "Querying the Arretine chronology graph"
  graph_url: "https://leiza-scit.github.io/CAA2026-alligator/arretine_sites_minigraph.ttl"
  about: >-
    An interactive companion to the CAA 2026 contribution: the same queries as the
    published query page, in a notebook you can extend. Everything runs in the
    browser under Pyodide; there is no endpoint and nothing leaves your machine.
  notes: |
    **Two groupings, one graph.** A `lado:PeriodCluster` groups findspots that the
    seriation gave exactly the same start and end year. A
    `lado:ChronologicalHorizon` is the phase a findspot was *assigned* to.
    Horizons 3–5 coincide with a single cluster each, but horizon 2 absorbs three
    clusters and horizon 1 two, so a horizon's interval is the *envelope* of its
    members and can be wider than any findspot in it.

    **Astronomical year numbering.** Dates are `xsd:gYear` literals in the
    proleptic Gregorian calendar, which has a year zero: `"-0008"` is 9 BC, not
    8 BC. rdflib does not compare `xsd:gYear` literals the way you would expect
    either — cast them first, as the queries below do with
    `xsd:integer(STR(?year))`.

    **Fixed versus estimated boundaries.** `lado:startfixed` and `lado:endfixed`
    mark boundaries resting on a historically dated event rather than on
    seriation alone. Only seven findspots carry such an anchor, and the whole
    chronology hangs on them.

    **Figures.** Three of the queries below draw something rather than print a
    table. They are the same figures as in `notebook/clades_variana_temporal
    .ipynb`, rebuilt from the query result rather than from a pandas frame, so
    the browser notebook and the Jupyter one show the same thing. The map
    fetches tiles from openstreetmap.org; everything else is computed from the
    Turtle file alone.

  # Pasted into the setup cell, above the figure code: the colours, the
  # relation vocabulary and the year formatting the figures share.
  viz_prelude: py/viz/_prelude.py

  explore:
    intro: |
      The graph is in `base` and stays in scope, as does `results`, which holds
      the rows of every query above under its id. A few things worth trying:

      - Change the year in the *Clades Variana* queries to 15 BC, the start of
        the Drusus campaigns: `ae:event_Drusus_campaigns` is in the graph too,
        with its own interval.
      - Swap `lado:hasHorizonMember` for `geosparql:memberOf` in the other
        direction — the graph carries both, and the second also reaches the
        period clusters and the corpus collection.
      - Ask for the findspots a horizon's convex hull covers, via
        `geosparql:hasGeometry`, and compare it with the points on the map.
      - List what the graph is actually made of: that is the cell below.
    sparql: |
      SELECT ?class (COUNT(?s) AS ?instances)
      WHERE {
        ?s a ?c .
        BIND(REPLACE(REPLACE(STR(?c), "^.*#", ""), "^.*/", "") AS ?class)
      }
      GROUP BY ?class
      ORDER BY DESC(?instances) ?class

  footer: |
    Produced for the CAA 2026 contribution *Seriation, Chronology and Linked
    Open Data* (LEIZA). The graph is built by `py/alligator_to_clean_rdf.py`
    from the output of [Alligator](https://tools.leiza.de/alligator/);
    vocabularies: CIDOC-CRM, OWL-Time, GeoSPARQL, SKOS and
    [LADO](http://archaeology.link/). Notebook structure follows the
    NFDI4Objects OER template.

prefixes: |
  PREFIX ae:        <http://leiza-scit.github.io/CAA2026-alligator/>
  PREFIX aecol:     <http://leiza-scit.github.io/CAA2026-alligator/collections/>
  PREFIX crm:       <http://www.cidoc-crm.org/cidoc-crm/>
  PREFIX aeont:     <http://leiza-scit.github.io/CAA2026-alligator/ontology#>
  PREFIX fsl:       <http://fuzzy-sl.squirrel.link/ontology/>
  PREFIX geosparql: <http://www.opengis.net/ont/geosparql#>
  PREFIX lado:      <http://archaeology.link/ontology#>
  PREFIX rdfs:      <http://www.w3.org/2000/01/rdf-schema#>
  PREFIX skos:      <http://www.w3.org/2004/02/skos/core#>
  PREFIX time:      <http://www.w3.org/2006/time#>
  PREFIX xsd:       <http://www.w3.org/2001/XMLSchema#>

queries:
  - id: horizons-overview
    title: "The five chronological horizons"
    intro: >-
      The starting point for everything else: each horizon with its interval and
      how many findspots it holds. Horizon 1 is the earliest, horizon 5 the
      latest. The interval is the envelope of the horizon's findspots, from the
      earliest start to the latest end.
    sparql: |
      SELECT ?horizon ?label ?begin ?end (COUNT(?site) AS ?findspots)
      WHERE {
        ?h a lado:ChronologicalHorizon ;
           skos:notation                     ?horizon ;
           rdfs:label                        ?label ;
           time:hasBeginning/time:inXSDgYear ?begin ;
           time:hasEnd/time:inXSDgYear       ?end ;
           lado:hasHorizonMember             ?site .
        FILTER(langMatches(LANG(?label), "en"))
      }
      GROUP BY ?horizon ?label ?begin ?end
      ORDER BY ?horizon

  - id: horizon-succession
    title: "How the horizons relate to one another"
    intro: >-
      The graph carries all twenty pairwise Allen relations between the horizons,
      so the sequence can be queried rather than read off a figure. Horizon 1
      *meets* horizon 3 — one ends exactly where the other begins — while horizon
      2 *contains* horizon 3 entirely.
    sparql: |
      SELECT ?horizonA ?relation ?horizonB
      WHERE {
        ?a a lado:ChronologicalHorizon ; skos:notation ?horizonA ; ?rel ?b .
        ?b a lado:ChronologicalHorizon ; skos:notation ?horizonB .
        FILTER(STRSTARTS(STR(?rel), STR(time:)))
        BIND(REPLACE(STR(?rel), "^.*#interval", "") AS ?relation)
      }
      ORDER BY ?horizonA ?horizonB

  - id: horizon-anchors
    title: "Which findspots anchor the chronology?"
    intro: >-
      Alligator marks a boundary as fixed when it rests on a historically dated
      event rather than on seriation alone. Only seven findspots carry such an
      anchor — and every horizon has at least one, which is what makes the
      sequence defensible.
    sparql: |
      SELECT ?horizon ?findspot ?startFixed ?endFixed ?begin ?end
      WHERE {
        ?h a lado:ChronologicalHorizon ;
           skos:notation         ?horizon ;
           lado:hasHorizonMember ?site .

        ?site rdfs:label                        ?findspot ;
              lado:startfixed                   ?startFixed ;
              lado:endfixed                     ?endFixed ;
              time:hasBeginning/time:inXSDgYear ?begin ;
              time:hasEnd/time:inXSDgYear       ?end .

        FILTER(?startFixed || ?endFixed)
      }
      ORDER BY ?horizon ?findspot

  - id: horizon-internal-structure
    title: "Findspots that do not fill their horizon"
    intro: >-
      Where every findspot carries the same dating, the horizon envelope
      describes the horizon exactly. Where members differ, the envelope is wider
      than any single findspot. This query returns only the findspots narrower
      than their horizon — none of them are in horizons 1 to 3, which is the
      quickest evidence that those three are internally homogeneous.
    sparql: |
      SELECT ?horizon ?findspot ?siteBegin ?siteEnd ?horizonBegin ?horizonEnd
      WHERE {
        ?h a lado:ChronologicalHorizon ;
           skos:notation                     ?horizon ;
           time:hasBeginning/time:inXSDgYear ?horizonBegin ;
           time:hasEnd/time:inXSDgYear       ?horizonEnd ;
           lado:hasHorizonMember             ?site .

        ?site rdfs:label                        ?findspot ;
              time:hasBeginning/time:inXSDgYear ?siteBegin ;
              time:hasEnd/time:inXSDgYear       ?siteEnd .

        FILTER(xsd:integer(STR(?siteBegin)) != xsd:integer(STR(?horizonBegin))
            || xsd:integer(STR(?siteEnd))   != xsd:integer(STR(?horizonEnd)))
      }
      ORDER BY ?horizon ?findspot

  - id: horizon-cluster-composition
    title: "Which seriation clusters does each horizon absorb?"
    intro: >-
      Both groupings live in the same graph, so one query can join them. A period
      cluster is computed — findspots the seriation gave an identical start and
      end year; a horizon is interpretive. Horizons 3 to 5 rest on a single
      cluster each, horizons 1 and 2 merge several, which is exactly why their
      envelopes are wider than their members.
    sparql: |
      SELECT ?horizon ?cluster (COUNT(?site) AS ?findspots)
      WHERE {
        ?h a lado:ChronologicalHorizon ;
           skos:notation         ?horizon ;
           lado:hasHorizonMember ?site .

        ?c a lado:PeriodCluster ;
           rdfs:label            ?cluster ;
           lado:hasClusterMember ?site .
      }
      GROUP BY ?horizon ?cluster
      ORDER BY ?horizon ?cluster

  - id: findspots-at-clades-variana
    title: "Which findspots were still in use in AD 9?"
    intro: >-
      The question the companion notebook works through in three different ways.
      Here it is resolved on the horizon level and in plain SPARQL: a findspot
      qualifies when its own interval covers AD 9, the year of the Clades
      Variana. Note the cast — rdflib will not compare xsd:gYear literals
      directly.
    sparql: |
      SELECT ?horizon ?findspot ?begin ?end
      WHERE {
        ?h a lado:ChronologicalHorizon ;
           skos:notation         ?horizon ;
           lado:hasHorizonMember ?site .

        ?site rdfs:label                        ?findspot ;
              time:hasBeginning/time:inXSDgYear ?begin ;
              time:hasEnd/time:inXSDgYear       ?end .

        FILTER(xsd:integer(STR(?begin)) <= 9 && xsd:integer(STR(?end)) >= 9)
      }
      ORDER BY ?horizon ?findspot

  - id: allen-relations-to-clades-variana
    title: "Every findspot's Allen relation to the Clades Variana"
    intro: >-
      The companion notebook computes Allen's thirteen interval relations in
      pandas. They can be derived in the query instead, with a chain of nested
      IFs testing the cases in Allen's order. Note that the event's interval is
      read from the graph rather than written into the query: the Clades
      Variana is recorded as AD 8 to 9, not as the single year AD 9, and
      hard-coding the year would quietly give different answers. The 44
      findspots fall into five of the thirteen relations, and both figures
      below are drawn from these rows.
    viz:
      - file: py/viz/allen_distribution.py
        title: "Distribution across the thirteen relations"
        intro: >-
          Coloured bars are the relations that count as contemporary with or
          later than the event; grey is *before*. Only five of the thirteen are
          occupied, and that is worth pausing on: the event's interval, AD 8 to
          9, falls exactly on two of the boundaries the seriation produced, so
          most findspots either end precisely where it ends (*finishedBy*, 21)
          or begin precisely where it begins (*startedBy*, 10). The relation is
          reporting a coincidence of boundaries, not a smooth distribution.
      - file: py/viz/clades_variana_timeline.py
        title: "The qualifying findspots on a timeline"
        intro: >-
          The same rows, narrowed to the qualifying relations and drawn as
          intervals, with AD 9 marked. Sort by relation to separate the four
          groups: the 21 findspots ending in the year of the defeat, the ten
          beginning in AD 8 where the event's interval opens, the single one
          spanning it — Worms, 15 BC to AD 13 — and the six that begin only
          afterwards.
    sparql: |
      SELECT ?site ?findspot ?begin ?end ?relation
      WHERE {
        ae:event_Clades_Variana
            time:hasBeginning/time:inXSDgYear ?eventBeginYear ;
            time:hasEnd/time:inXSDgYear       ?eventEndYear .

        ?s a fsl:Site , time:Interval ;
           rdfs:label                        ?findspot ;
           time:hasBeginning/time:inXSDgYear ?beginYear ;
           time:hasEnd/time:inXSDgYear       ?endYear .

        BIND(xsd:integer(STR(?beginYear))      AS ?begin)
        BIND(xsd:integer(STR(?endYear))        AS ?end)
        BIND(xsd:integer(STR(?eventBeginYear)) AS ?eventBegin)
        BIND(xsd:integer(STR(?eventEndYear))   AS ?eventEnd)
        BIND(REPLACE(STR(?s), "^.*/", "")      AS ?site)

        BIND(IF(?end   <  ?eventBegin, "before",
             IF(?begin >  ?eventEnd,   "after",
             IF(?end   =  ?eventBegin, "meets",
             IF(?begin =  ?eventEnd,   "metBy",
             IF(?begin =  ?eventBegin && ?end =  ?eventEnd, "equals",
             IF(?begin <  ?eventBegin && ?end >  ?eventEnd, "contains",
             IF(?begin >  ?eventBegin && ?end <  ?eventEnd, "during",
             IF(?begin =  ?eventBegin && ?end <  ?eventEnd, "starts",
             IF(?begin =  ?eventBegin && ?end >  ?eventEnd, "startedBy",
             IF(?begin <  ?eventBegin && ?end =  ?eventEnd, "finishedBy",
             IF(?begin >  ?eventBegin && ?end =  ?eventEnd, "finishes",
             IF(?begin <  ?eventBegin && ?end <  ?eventEnd, "overlaps",
             IF(?begin >  ?eventBegin && ?end >  ?eventEnd, "overlappedBy",
                                                            "unknown")))))))))))))
             AS ?relation)
      }
      ORDER BY ?begin ?findspot

  - id: horizon-authority-links
    title: "How well is each horizon linked to gazetteers?"
    intro: >-
      A practical linked-data question: can every findspot be reconciled against
      an external authority? Gaps mark the places where this graph cannot yet be
      joined to Wikidata or Pleiades.
    sparql: |
      SELECT ?horizon (COUNT(DISTINCT ?site) AS ?findspots)
                      (COUNT(DISTINCT ?wikidata) AS ?withWikidata)
                      (COUNT(DISTINCT ?pleiades) AS ?withPleiades)
      WHERE {
        ?h a lado:ChronologicalHorizon ;
           skos:notation         ?horizon ;
           lado:hasHorizonMember ?site .
        OPTIONAL { ?site lado:wikidata ?wikidata }
        OPTIONAL { ?site lado:pleiades ?pleiades }
      }
      GROUP BY ?horizon
      ORDER BY ?horizon

  - id: findspot-coordinates
    title: "Where the findspots are"
    intro: >-
      Every findspot carries a point geometry as a GeoSPARQL WKT literal, so
      the horizons can be read as a distribution as well as a sequence. WKT
      gives the coordinates in longitude-latitude order and prefixes the CRS
      IRI, hence the two REPLACE calls; the horizon and the authority links
      come along for the map's popups.
    viz:
      - file: py/viz/site_map.py
        title: "The findspots on a map"
        intro: >-
          Points are coloured by horizon, cold to warm, and each horizon is its
          own layer — switch them off in the control at the top right to see
          one phase at a time. The Rhine, the Danube and the roads between them
          account for all but one findspot: Conimbriga, in horizon 3, sits 1411
          km from its nearest neighbour in the corpus. It is worth switching
          horizon 3 on and off, because that single point is what makes the
          horizon's convex hull so much larger than the others — a reminder
          that a wide hull can mean one distant site rather than a wide
          distribution.
    sparql: |
      SELECT ?findspot ?horizon ?begin ?end ?latitude ?longitude
             ?wikidata ?pleiades
      WHERE {
        ?site a fsl:Site ;
              rdfs:label                            ?findspot ;
              geosparql:hasGeometry/geosparql:asWKT ?wkt ;
              time:hasBeginning/time:inXSDgYear     ?beginYear ;
              time:hasEnd/time:inXSDgYear           ?endYear .

        OPTIONAL {
          ?h a lado:ChronologicalHorizon ;
             skos:notation         ?horizon ;
             lado:hasHorizonMember ?site .
        }
        OPTIONAL { ?site lado:wikidata ?wikidata }
        OPTIONAL { ?site lado:pleiades ?pleiades }

        BIND(xsd:integer(STR(?beginYear)) AS ?begin)
        BIND(xsd:integer(STR(?endYear))   AS ?end)
        BIND(REPLACE(STR(?wkt),
             "^.*POINT\\s*\\(\\s*(\\S+)\\s+(\\S+)\\s*\\).*$", "$1") AS ?longitude)
        BIND(REPLACE(STR(?wkt),
             "^.*POINT\\s*\\(\\s*(\\S+)\\s+(\\S+)\\s*\\).*$", "$2") AS ?latitude)
      }
      ORDER BY ?horizon ?findspot
  - id: service-composition
    title: "What each assemblage is made of"
    needs: services
    intro: >-
      The first query over the evidence rather than over the result. The counts
      live in a second graph, built by `py/services_to_rdf.py` from the
      workbook and merged with this one on the fly — the notice above says when
      it is being fetched. Percentages are computed here rather than stored: a
      derived number kept beside the number it derives from is a second thing
      that has to stay true.
    viz:
      - file: py/viz/service_composition.py
        title: "Service composition per findspot"
        intro: >-
          Every bar is 100% of that findspot's sherds, so assemblages of very
          different size can be compared; the figure at the right is how many
          sherds that is. Sorted by start year the shift is plain — the red
          Service I types give way to the green Service II ones — but so is how
          thin the evidence gets at both ends of the sequence.
    sparql: |
      SELECT ?findspot ?begin ?horizon ?type ?rank ?sherds ?total
      WHERE {
        ?obs aeont:atFindspot  ?site ;
             aeont:serviceType ?concept ;
             aeont:sherdCount  ?sherds .

        ?site rdfs:label                        ?findspot ;
              time:hasBeginning/time:inXSDgYear ?beginYear .

        ?concept skos:prefLabel        ?type ;
                 aeont:typologicalRank ?rank .
        FILTER(lang(?type) = "de")

        OPTIONAL {
          ?h a lado:ChronologicalHorizon ;
             skos:notation         ?horizon ;
             lado:hasHorizonMember ?site .
        }

        # The findspot's own total, so the share can be worked out per row.
        {
          SELECT ?site (SUM(?k) AS ?total)
          WHERE { ?o aeont:atFindspot ?site ; aeont:sherdCount ?k }
          GROUP BY ?site
        }

        BIND(xsd:integer(STR(?beginYear)) AS ?begin)
      }
      ORDER BY ?begin ?findspot ?rank

  - id: service-within-group-variability
    title: "How tightly each horizon is defined"
    needs: services
    intro: >-
      The RGZM variance and quality of Allard Mees, computed in the query as far
      as SPARQL reaches. Every sherd counts as one observation valued by the rank
      of its sub-type within its group, so N, the sum of the ranks and the sum of
      their squares are enough to derive the rest — which is fortunate, because
      rdflib's SPARQL has neither SQRT nor EXP and `s` and `q = exp(−CV)` have to
      be taken in Python. Both rank readings come back from the one query: the
      stage reading this project reports, and the column reading kept for
      comparison. `COUNT(DISTINCT ?rank)` reports how many ranks a group actually
      holds, so a cell whose value follows from the rank assignment alone can be
      told apart from one that was measured.
    viz:
      - file: py/viz/service_variability.py
        title: "Within-group variance and quality per horizon"
        intro: >-
          Quality rises steadily from the earliest horizon to the latest under
          both readings, and the two order the horizons identically — the
          finding does not rest on the choice between them. Service II is grey
          throughout because it holds one stage: its numbers are structural, not
          measured.
    sparql: |
      SELECT ?horizon ?group (SUM(?sherds) AS ?sherds)
             (SUM(?stage * ?sherds)            AS ?sumStage)
             (SUM(?stage * ?stage * ?sherds)   AS ?sumStageSq)
             (COUNT(DISTINCT ?stage)           AS ?stageSteps)
             (SUM(?column * ?sherds)           AS ?sumColumn)
             (SUM(?column * ?column * ?sherds) AS ?sumColumnSq)
             (COUNT(DISTINCT ?column)          AS ?columnSteps)
      WHERE {
        ?h a lado:ChronologicalHorizon ;
           skos:notation         ?horizon ;
           lado:hasHorizonMember ?site .

        ?obs aeont:atFindspot  ?site ;
             aeont:serviceType ?concept ;
             aeont:sherdCount  ?sherds .

        # The group is the concept's top concept, reached through skos:broader.
        ?concept aeont:stageRank  ?stage ;
                 aeont:columnRank ?column ;
                 skos:broader*    ?top .
        ?top skos:topConceptOf ?scheme ;
             skos:prefLabel    ?group .
        FILTER(lang(?group) = "en")
      }
      GROUP BY ?horizon ?group
      ORDER BY ?horizon ?group
