        class="num">0,898</td><td class="num">2,89</td><td><span class="pill keep">mesuré</span></td></tr>
        <tr class="degen"><td>1</td><td>Service II</td><td class="num">2</td><td class="num">30</td><td
        class="num">0,000</td><td class="num">1,000</td><td class="num">1,00</td><td><span class="pill
        drop">un seul stade</span></td></tr> <tr class="degen"><td>2</td><td>Service II</td><td class="num">2</td><td
        class="num">961</td><td class="num">0,000</td><td class="num">1,000</td><td class="num">1,00</td><td><span
        class="pill drop">un seul stade</span></td></tr> <tr class="degen"><td>3</td><td>Service II</td><td
        class="num">2</td><td class="num">1224</td><td class="num">0,000</td><td class="num">1,000</td><td
        class="num">1,00</td><td><span class="pill drop">un seul stade</span></td></tr> <tr class="degen"><td>4</td><td>Service
        II</td><td class="num">2</td><td class="num">327</td><td class="num">0,000</td><td class="num">1,000</td><td
        class="num">1,00</td><td><span class="pill drop">un seul stade</span></td></tr> <tr class="degen"><td>5</td><td>Service
        II</td><td class="num">2</td><td class="num">1231</td><td class="num">0,000</td><td class="num">1,000</td><td
        class="num">1,00</td><td><span class="pill drop">un seul stade</span></td></tr> <tr class="degen"><td>1</td><td>Assiette
        à bord oblique</td><td class="num">1</td><td class="num">6</td><td class="num">0,000</td><td class="num">1,000</td><td
        class="num">1,00</td><td><span class="pill drop">un seul stade</span></td></tr> <tr class="degen"><td>2</td><td>Assiette
        à bord oblique</td><td class="num">1</td><td class="num">4</td><td class="num">0,000</td><td class="num">1,000</td><td
        class="num">1,00</td><td><span class="pill drop">un seul stade</span></td></tr> <tr class="degen"><td>3–5</td><td>Assiette
        à bord oblique</td><td class="num">0</td><td class="num">0</td><td class="num">—</td><td class="num">—</td><td
        class="num">—</td><td><span class="pill legacy">absent</span></td></tr> </tbody>
  - type: note
    html:
      en: <strong>The em-dash and the zero are different statements.</strong> The oblique-rim plate in
        horizons 3 to 5 is absent — no material at all, correctly left blank. Everywhere else the zero
        means material is present but sits on a single rank. Keeping the two visually distinct, as the
        figure does, is right; the caption should say so explicitly, because a reader cannot infer it.
      fr: <strong>Le tiret et le zéro ne disent pas la même chose.</strong> L’assiette à bord oblique
        est absente des horizons 3 à 5 — aucun matériel, à juste titre laissé vide. Partout ailleurs,
        le zéro signifie que du matériel est présent mais tient sur un seul rang. Les distinguer visuellement,
        comme le fait la figure, est correct ; la légende devrait le dire explicitement, car un lecteur
        ne peut le déduire.
  - type: note
    html:
      en: <strong>Where the sub-type count drops.</strong> Service I loses <em>Service Ia cup</em> in
        horizon 4 and both Ia sub-types in horizon 5 — the earliest stage simply runs out. That is a real
        chronological observation, and it is also the reason the unweighted alternative of <a href="#n">§8</a>
        produces any gradient at all.
      fr: <strong>Où le nombre de sous-types diminue.</strong> Le Service I perd la <em>tasse Service
        Ia</em> à l’horizon 4 et les deux sous-types Ia à l’horizon 5 — le stade le plus ancien s’épuise,
        tout simplement. C’est une véritable observation chronologique, et c’est aussi la raison pour
        laquelle la variante non pondérée du <a href="#n">§8</a> produit un gradient quelconque.
- id: limits
  marker: '11'
  heading:
    en: Limitations and open questions
    fr: Limites et questions ouvertes
  sub:
    en: To be settled before the figure goes into the paper.
    fr: À trancher avant que la figure n’entre dans l’article.
  blocks:
  - type: ol
    html:
      en: '<li><strong>Ranks by stage only.</strong> Because sub-types of one stage share a rank, the
        dispersion of any single-stage group is zero by construction. This is the direct cause of the
        two flat columns. It is the right modelling decision on the archaeology — a cup and a plate of
        one stage are contemporary — but it means those columns carry no measurement and the caption must
        say so. <a href="#ranks">§3</a></li> <li><strong>Undefined dispersion printed as a number.</strong>
        Where a group holds one rank, \(s = 0\) and \(q = 1\) follow from the rank table, not from the
        sherds. The figure greys them; the greying is computed from <code>COUNT(DISTINCT ?stage)</code>
        and is therefore reliable, but it is not labelled. <a href="#degenerate">§7</a></li> <li><strong>Within-group
        spread is not group share.</strong> The panels say nothing about how much of each group is present,
        which for this material is the stronger signal (Service II: about 6 % to about 92 % across the
        sequence). Report the two together. <a href="#sigma">§4</a></li> <li><strong>Dataset-relative
        colour scaling on the left panel.</strong> The variance ramp ends at the largest observed value,
        so colours are not stable across runs. <a href="#panels">§6</a></li> <li><strong>Confounding of
        \(s\) with sample size.</strong> Dispersion and \(n\) fall together along the Service I column:
        horizon 5 rests on 103 sherds against horizon 2''s 1741. A rarefaction check would separate them.
        <a href="#servicei">§9</a></li> <li><strong>Horizon assignment is a hardcoded convention.</strong>
        Five classes from <code>FINDSPOT_HORIZON</code>, with a label bridge for findspots the workbook
        and the TTL spell differently. Maintainable and single-sourced, but it must travel with the figure
        as provenance rather than living only in the module.</li> <li><strong>Ordinal ranks under a ratio-scale
        statistic — settled by declaration.</strong> The coefficient of variation divides by the mean,
        so \(q\) depends on where the rank numbering starts, while \(s\) does not. The project needs \(q\),
        so the numbering is now part of the method rather than an implementation detail: <strong>the first
        stage of every group carries rank 1, and ranks run 1…k in stage order with no gaps.</strong> It
        is derived from <code>TYPES</code> in <code>services_to_rdf.py</code> and published as <code>aeont:stageRank</code>,
        so any reader can recompute against it. See below for what is being fixed. <a href="#origin">§11
        a</a></li>'
      fr: '<li><strong>Rangs par stade seulement.</strong> Comme les sous-types d’un même stade partagent
        un rang, la dispersion de tout groupe à stade unique est nulle par construction. C’est la cause
        directe des deux colonnes plates. Du point de vue archéologique, la décision de modélisation est
        la bonne — une tasse et une assiette d’un même stade sont contemporaines — mais elle implique
        que ces colonnes ne portent aucune mesure, et la légende doit le dire. <a href="#ranks">§3</a></li>
        <li><strong>Une dispersion indéfinie imprimée comme un nombre.</strong> Lorsqu’un groupe ne tient
        qu’un rang, \(s = 0\) et \(q = 1\) découlent de la table des rangs, non des tessons. La figure
        les grise ; le grisé est calculé à partir de <code>COUNT(DISTINCT ?stage)</code> et est donc fiable,
        mais il n’est pas explicité. <a href="#degenerate">§7</a></li> <li><strong>L’étalement intra-groupe
        n’est pas la part du groupe.</strong> Les panneaux ne disent rien de la quantité présente de chaque
        groupe, qui pour ce matériel constitue le signal le plus fort (Service II : d’environ 6 % à environ
        92 % au fil de la séquence). Publier les deux ensemble. <a href="#sigma">§4</a></li> <li><strong>Échelle
        de couleurs relative au jeu de données dans le panneau gauche.</strong> L’échelle de variance
        s’arrête à la plus grande valeur observée : les couleurs ne sont donc pas stables d’une exécution
        à l’autre. <a href="#panels">§6</a></li> <li><strong>Confusion entre \(s\) et la taille d’échantillon.</strong>
        La dispersion et \(n\) décroissent ensemble le long de la colonne Service I : l’horizon 5 repose
        sur 103 tessons contre 1741 pour l’horizon 2. Un contrôle par raréfaction les départagerait. <a
        href="#servicei">§9</a></li> <li><strong>L’affectation aux horizons est une convention codée en
        dur.</strong> Cinq classes issues de <code>FINDSPOT_HORIZON</code>, avec une table de correspondance
        pour les sites que le classeur et le TTL orthographient différemment. Maintenable et à source
        unique, mais elle doit accompagner la figure au titre de la provenance plutôt que de ne vivre
        que dans le module.</li> <li><strong>Des rangs ordinaux sous une statistique d’échelle de rapport
        — tranché par déclaration.</strong> Le coefficient de variation divise par la moyenne : \(q\)
        dépend donc du point de départ de la numérotation, ce qui n’est pas le cas de \(s\). Le projet
        a besoin de \(q\) : la numérotation relève désormais de la méthode et non d’un détail d’implémentation
        — <strong>le premier stade de chaque groupe porte le rang 1, et les rangs courent de 1 à k dans
        l’ordre des stades, sans lacune.</strong> Elle est dérivée de <code>TYPES</code> dans <code>services_to_rdf.py</code>
        et publiée sous <code>aeont:stageRank</code> : tout lecteur peut donc recalculer sur cette base.
        Voir ci-dessous ce que cela fixe. <a href="#origin">§11 a</a></li>'
  - type: note
    html:
      en: '<strong>Decision: the rank origin is fixed at 1 and declared.</strong> \(q\) is needed, so
        the alternative — dropping \(q\) and reporting \(s\) alone — was not taken. What follows from
        that is an obligation rather than a caveat: the numbering must be stated in the method section,
        carried in the graph as <code>aeont:stageRank</code>, and repeated in the figure caption, because
        a \(q\) quoted without it cannot be reproduced.'
      fr: '<strong>Décision : l’origine des rangs est fixée à 1 et déclarée.</strong> \(q\) est nécessaire
        ; l’autre voie — abandonner \(q\) et ne publier que \(s\) — n’a donc pas été retenue. Il en résulte
        une obligation plutôt qu’une réserve : la numérotation doit être énoncée dans la section méthodologique,
        portée dans le graphe sous <code>aeont:stageRank</code>, et répétée dans la légende de la figure,
        car un \(q\) cité sans elle n’est pas reproductible.'
- id: origin
  marker: 11a
  heading:
    en: What the declaration fixes
    fr: Ce que la déclaration fixe
  sub:
    en: How much of \(q\) is the data and how much is the numbering.
    fr: Quelle part de \(q\) vient des données et quelle part de la numérotation.
  blocks:
  - type: figure
    figure: rank_origin_sensitivity
    caption:
      en: 'Service I, all five horizons, under every plausible numbering. Two things hold at once. The
        <em>level</em> of \(q\) is not a property of the sherds — horizon 1 reads 0.622 if the first stage
        is numbered 0 and 0.942 if it is numbered 10, and the whole family is driven towards 1 as the
        origin grows, because a larger mean shrinks the CV. But the <em>order</em> never changes: horizon
        1 is the most dispersed at every origin and horizon 5 the least, and no two curves cross. Every
        value of \(s\) is identical along each curve.'
      fr: 'Service I, les cinq horizons, sous toute numérotation plausible. Deux choses valent en même
        temps. Le <em>niveau</em> de \(q\) n’est pas une propriété des tessons : l’horizon 1 vaut 0,622
        si le premier stade est numéroté 0 et 0,942 s’il est numéroté 10, et toute la famille est poussée
        vers 1 à mesure que l’origine croît, car une moyenne plus grande réduit le CV. Mais l’<em>ordre</em>
        ne change jamais : l’horizon 1 est le plus dispersé pour toute origine et l’horizon 5 le moins,
        et aucune courbe n’en croise une autre. Toutes les valeurs de \(s\) sont identiques le long de
        chaque courbe.'
  - type: note
    html:
      en: '<strong>What this licenses in the text.</strong> Comparisons between horizons — "horizon 5
        is tighter than horizon 1" — are safe: they survive any numbering. A bare quoted level — "the
        quality of horizon 3 is 0.85" — is only meaningful together with the declaration, and is not comparable
        with a \(q\) from any other study unless that study numbers its ranks the same way. The safest
        formulation in the paper is to lead with \(s\), which is origin-free, and to introduce \(q\) as
        its bounded presentation.'
      fr: '<strong>Ce que cela autorise dans le texte.</strong> Les comparaisons entre horizons — « l’horizon
        5 est plus resserré que l’horizon 1 » — sont sûres : elles survivent à toute numérotation. Un
        niveau cité seul — « la qualité de l’horizon 3 vaut 0,85 » — n’a de sens qu’accompagné de la déclaration,
        et n’est comparable à un \(q\) d’une autre étude que si celle-ci numérote ses rangs de la même
        façon. La formulation la plus sûre dans l’article consiste à mener avec \(s\), indépendant de
        l’origine, et à introduire \(q\) comme sa présentation bornée.'
  - type: warn
    html:
      en: <strong>Three places the numbering has to appear.</strong> The method section, as one sentence;
        the graph, where <code>aeont:stageRank</code> already carries it per concept, so the assertion
        is machine-checkable; and the figure caption, since the figure will be reused without the paper
        around it. If it appears in only the first two, the caption is the one that will be quoted.
      fr: <strong>Trois endroits où la numérotation doit figurer.</strong> La section méthodologique,
        en une phrase ; le graphe, où <code>aeont:stageRank</code> la porte déjà par concept, ce qui rend
        l’assertion vérifiable par machine ; et la légende de la figure, puisque celle-ci sera réutilisée
        hors de l’article. Si elle ne figure qu’aux deux premiers endroits, c’est justement la légende
        qui sera citée.
- id: legend
  marker: '12'
  heading:
