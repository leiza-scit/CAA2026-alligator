    fr: Glossaire de la légende
  sub:
    en: Every mark on the figure, and what licenses it.
    fr: Chaque marque de la figure, et ce qui l’autorise.
  blocks:
  - type: table
    html:
      en: <thead><tr><th>Mark</th><th>Meaning</th><th>Source</th></tr></thead> <tbody> <tr><td>row label
        <code>Horizon 1…5</code></td><td>chronological class of the findspot</td><td><code>FINDSPOT_HORIZON</code></td></tr>
        <tr><td>column label</td><td>service group; colour matches the timeline figures</td><td>sub-type
        → group map</td></tr> <tr><td>large number, left</td><td>\(s\), sample standard deviation of the
