      fr: <thead><tr><th>Marque</th><th>Signification</th><th>Source</th></tr></thead> <tbody> <tr><td>étiquette
        de ligne <code>Horizon 1…5</code></td><td>classe chronologique du site</td><td><code>FINDSPOT_HORIZON</code></td></tr>
        <tr><td>étiquette de colonne</td><td>groupe de service ; couleur accordée aux figures de frise</td><td>table
        sous-type → groupe</td></tr> <tr><td>grand nombre, à gauche</td><td>\(s\), écart-type d’échantillon
