<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 700 250" role="img" aria-label="Aggregation chain from the spreadsheet through horizon assignment and group assignment to one heatmap cell, with the counts running in a separate lane"> <defs> <marker id="ch-ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"> <path d="M0,0 L8,4 L0,8 z" fill="#46525f"/> </marker> <marker id="ch-ar-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"> <path d="M0,0 L8,4 L0,8 z" fill="#a29b8c"/> </marker> </defs> <!-- stage boxes --> <g fill="#fff" stroke="#d9d3c6"> <rect x="14" y="26" width="150" height="66"/> <rect x="190" y="26" width="150" height="66"/> <rect x="366" y="26" width="150" height="66"/> </g> <rect x="556" y="26" width="128" height="66" fill="#9e3b26" fill-opacity=".14" stroke="#9e3b26"/> <g font-family="Public Sans" font-size="10.5" fill="#1b2430" text-anchor="middle"> <text x="89" y="48">ArretineDatedSites</text> <text x="89" y="62">ServicesI_II.xlsx</text> <text x="89" y="80" fill="#46525f">45 findspots · 9 sub-types</text> <text x="265" y="48">assign each findspot</text> <text x="265" y="62">to a horizon</text> <text x="265" y="80" fill="#46525f">FINDSPOT_HORIZON · 5 classes</text> <text x="441" y="48">assign each sub-type</text> <text x="441" y="62">to a service group</text> <text x="441" y="80" fill="#46525f">9 sub-types → 3 groups</text> <text x="620" y="52" fill="#9e3b26" font-size="11.5" font-weight="600">one cell</text> <text x="620" y="70" fill="#9e3b26">(horizon, group)</text> </g> <g stroke="#46525f" stroke-width="1.2" marker-end="url(#ch-ar)"> <line x1="164" y1="59" x2="184" y2="59"/> <line x1="340" y1="59" x2="360" y2="59"/> <line x1="516" y1="59" x2="550" y2="59"/> </g> <!-- outputs --> <g stroke="#46525f" stroke-width="1.2" fill="none"> <line x1="620" y1="92" x2="620" y2="116"/> <line x1="470" y1="116" x2="620" y2="116"/> <line x1="470" y1="116" x2="470" y2="134" marker-end="url(#ch-ar)"/> <line x1="620" y1="116" x2="620" y2="134" marker-end="url(#ch-ar)"/> </g> <rect x="400" y="140" width="140" height="34" fill="#fff" stroke="#9e3b26"/> <rect x="556" y="140" width="128" height="34" fill="#fff" stroke="#40655c"/> <g font-family="Public Sans" font-size="10.5" text-anchor="middle"> <text x="470" y="161" fill="#9e3b26">σ · left panel</text> <text x="620" y="161" fill="#40655c">q · right panel</text> </g> <!-- counts feed both statistics: n is the N of the formula, not a caption --> <g stroke="#46525f" stroke-width="1.2" fill="none"> <line x1="89" y1="92" x2="89" y2="218"/> <line x1="89" y1="218" x2="620" y2="218"/> <line x1="470" y1="218" x2="470" y2="180" marker-end="url(#ch-ar)"/> <line x1="620" y1="218" x2="620" y2="180" marker-end="url(#ch-ar)"/> </g> <g font-family="Public Sans" font-size="10.5" fill="#46525f"> <text x="240" y="238" text-anchor="middle">sherd counts — the N of both statistics, not a caption beside them</text> </g> </svg>