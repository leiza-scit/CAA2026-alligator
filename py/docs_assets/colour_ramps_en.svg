<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 700 205" role="img" aria-label="The two colour ramps side by side: the variance ramp is scaled to the observed maximum, the quality ramp to the fixed interval zero to one"> <defs> <linearGradient id="ramp-var" x1="0" x2="1"> <stop offset="0" stop-color="#006837"/> <stop offset="0.25" stop-color="#a6d96a"/> <stop offset="0.5" stop-color="#ffffbf"/> <stop offset="0.75" stop-color="#fdae61"/> <stop offset="1" stop-color="#a50026"/> </linearGradient> <linearGradient id="ramp-q" x1="0" x2="1"> <stop offset="0" stop-color="#a50026"/> <stop offset="0.25" stop-color="#fdae61"/> <stop offset="0.5" stop-color="#ffffbf"/> <stop offset="0.75" stop-color="#a6d96a"/> <stop offset="1" stop-color="#006837"/> </linearGradient> </defs> <text x="40" y="34" font-family="Public Sans" font-size="11.5" font-weight="600" fill="#1b2430">Variance panel</text> <rect x="40" y="46" width="280" height="24" fill="url(#ramp-var)" stroke="#1b2430" stroke-width=".6"/> <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#46525f"> <text x="40" y="86">0.00</text> <text x="320" y="86" text-anchor="end">0.68</text> </g> <text x="180" y="106" text-anchor="middle" font-family="Public Sans" font-size="10.5" fill="#9e3b26">upper end = largest value in this dataset</text> <text x="180" y="122" text-anchor="middle" font-family="Public Sans" font-size="10.5" fill="#9e3b26">→ colours are relative; not comparable between runs</text> <text x="380" y="34" font-family="Public Sans" font-size="11.5" font-weight="600" fill="#1b2430">Quality panel</text> <rect x="380" y="46" width="280" height="24" fill="url(#ramp-q)" stroke="#1b2430" stroke-width=".6"/> <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#46525f"> <text x="380" y="86">0.00</text> <text x="660" y="86" text-anchor="end">1.00</text> </g> <text x="520" y="106" text-anchor="middle" font-family="Public Sans" font-size="10.5" fill="#40655c">upper end = the theoretical maximum of q</text> <text x="520" y="122" text-anchor="middle" font-family="Public Sans" font-size="10.5" fill="#40655c">→ colours are absolute; comparable between runs</text> <line x1="40" y1="146" x2="660" y2="146" stroke="#d9d3c6"/> <text x="350" y="170" text-anchor="middle" font-family="Public Sans" font-size="11" fill="#1b2430">green = good in both panels · the ramps are reversed, the measurement is not</text> <text x="350" y="190" text-anchor="middle" font-family="Public Sans" font-size="10.5" fill="#46525f">grey = degenerate cell, taken off the ramp altogether</text> </svg>