<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 700 336" role="img" aria-label="Service I quality by horizon under sherd weighting and under one vote per sub-type; the unweighted column is identical for horizons one to three"> <defs><linearGradient id="w8ramp" x1="0" x2="1"><stop offset="0.0" stop-color="#a50026"/><stop offset="0.25" stop-color="#f88d52"/><stop offset="0.5" stop-color="#feffbe"/><stop offset="0.75" stop-color="#86ca66"/><stop offset="1.0" stop-color="#006837"/></linearGradient></defs> <g font-family="Public Sans" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b2430"> <text x="255" y="26">as computed · sherd-weighted</text> <text x="500" y="26">alternative · one vote per sub-type</text> </g> <g stroke="#ffffff" stroke-width="2"> <rect x="170" y="38" width="170" height="40" fill="#1b9850"/> <rect x="170" y="80" width="170" height="40" fill="#3ca859"/> <rect x="170" y="122" width="170" height="40" fill="#42ab5a"/> <rect x="170" y="164" width="170" height="40" fill="#73c264"/> <rect x="170" y="206" width="170" height="40" fill="#82c966"/> <rect x="415" y="38" width="170" height="40" fill="#6abf63"/> <rect x="415" y="80" width="170" height="40" fill="#addc6f"/> <rect x="415" y="122" width="170" height="40" fill="#c5e67e"/> <rect x="415" y="164" width="170" height="40" fill="#c5e67e"/> <rect x="415" y="206" width="170" height="40" fill="#c5e67e"/> </g> <g font-family="Public Sans" font-size="16" text-anchor="middle"> <text x="255" y="64" fill="#ffffff">0.898</text> <text x="255" y="106" fill="#ffffff">0.854</text> <text x="255" y="148" fill="#ffffff">0.847</text> <text x="255" y="190" fill="#1a1a1a">0.780</text> <text x="255" y="232" fill="#1a1a1a">0.756</text> <text x="500" y="64" fill="#1a1a1a">0.639</text> <text x="500" y="106" fill="#1a1a1a">0.684</text> <text x="500" y="148" fill="#1a1a1a">0.639</text> <text x="500" y="190" fill="#1a1a1a">0.639</text> <text x="500" y="232" fill="#1a1a1a">0.639</text> </g> <g font-family="Public Sans" font-size="11" text-anchor="end" fill="#1b2430"> <text x="158" y="63">Horizon 5</text><text x="158" y="105">Horizon 4</text> <text x="158" y="147">Horizon 3</text><text x="158" y="189">Horizon 2</text> <text x="158" y="231">Horizon 1</text> </g> <g font-family="IBM Plex Mono, monospace" font-size="9" text-anchor="end" fill="#8a8272"> <text x="158" y="75">n=103</text><text x="158" y="117">n=149</text> <text x="158" y="159">n=908</text><text x="158" y="201">n=1741</text> <text x="158" y="243">n=446</text> </g> <path d="M600 122 L612 122 L612 246 L600 246" fill="none" stroke="#9e3b26" stroke-width="1.4"/> <text x="620" y="180" font-family="Public Sans" font-size="10.5" fill="#9e3b26">identical</text> <text x="620" y="194" font-family="Public Sans" font-size="10.5" fill="#9e3b26">k = 6 in</text> <text x="620" y="208" font-family="Public Sans" font-size="10.5" fill="#9e3b26">all three</text> <line x1="40" y1="262" x2="660" y2="262" stroke="#d9d3c6"/> <text x="40" y="282" font-family="Public Sans" font-size="11" fill="#1b2430">Unweighted, the value depends only on <tspan font-style="italic">which</tspan> sub-types are present — never on how much of each.</text> <rect x="40" y="296" width="240" height="14" fill="url(#w8ramp)" stroke="#1b2430" stroke-width=".5"/> <g font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#46525f" text-anchor="middle"> <text x="40" y="324">0.0</text><text x="160" y="324">0.5</text><text x="280" y="324">1.0</text> </g> <text x="292" y="307" font-family="Public Sans" font-size="9.5" fill="#8a8272">absolute scale, 0 to 1 — the same ramp as the printed quality panel</text> </svg>