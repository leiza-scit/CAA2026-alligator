<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 700 265" role="img" aria-label="Three configurations that produce a heatmap cell: one sub-type, several sub-types sharing a rank, and several sub-types on genuinely near ranks"> <g font-family="Public Sans" font-size="11" font-weight="600" fill="#1b2430" text-anchor="middle"> <text x="118" y="24" fill="#1f77b4">a · Assiette à bord oblique</text> <text x="350" y="24" fill="#2ca02c">b · Service II</text> <text x="582" y="24" fill="#d62728">c · Service I</text> </g> <g font-family="Public Sans" font-size="10.5" fill="#46525f" text-anchor="middle"> <text x="118" y="41">1 sous-type · 1 rang</text> <text x="350" y="41">2 sous-types · 1 rang</text> <text x="582" y="41">6 sous-types · 3 rangs</text> </g> <!-- mini rank axes --> <g stroke="#46525f"> <line x1="34" y1="118" x2="202" y2="118"/> <line x1="266" y1="118" x2="434" y2="118"/> <line x1="498" y1="118" x2="666" y2="118"/> </g> <g stroke="#e2ddd1"> <line x1="76" y1="56" x2="76" y2="118"/><line x1="118" y1="56" x2="118" y2="118"/><line x1="160" y1="56" x2="160" y2="118"/> <line x1="308" y1="56" x2="308" y2="118"/><line x1="350" y1="56" x2="350" y2="118"/><line x1="392" y1="56" x2="392" y2="118"/> <line x1="540" y1="56" x2="540" y2="118"/><line x1="582" y1="56" x2="582" y2="118"/><line x1="624" y1="56" x2="624" y2="118"/> </g> <g fill="#1f77b4"> <circle cx="118" cy="100" r="4.5"/> </g> <g fill="#2ca02c"> <circle cx="350" cy="100" r="4.5"/><circle cx="350" cy="86" r="4.5"/> </g> <g fill="#d62728"> <circle cx="540" cy="100" r="4.5"/><circle cx="540" cy="86" r="4.5"/> <circle cx="582" cy="100" r="4.5"/><circle cx="582" cy="86" r="4.5"/> <circle cx="624" cy="100" r="4.5"/><circle cx="624" cy="86" r="4.5"/> </g> <!-- resulting cells --> <rect x="46" y="146" width="144" height="62" fill="#eaeaea" stroke="#ffffff" stroke-width="2"/> <rect x="278" y="146" width="144" height="62" fill="#eaeaea" stroke="#ffffff" stroke-width="2"/> <rect x="510" y="146" width="144" height="62" fill="#42ab5a" stroke="#ffffff" stroke-width="2"/> <g font-family="Public Sans" font-size="19" text-anchor="middle" fill="#46525f"> <text x="118" y="180">1,00</text> <text x="350" y="180">1,00</text> <text x="582" y="180" fill="#ffffff">0,85</text> </g> <g font-family="Public Sans" font-size="10" text-anchor="middle" fill="#8a8272"> <text x="118" y="198">n = 6 · horizon 1</text> <text x="350" y="198">n = 1231 · horizon 5</text> <text x="582" y="198" fill="#e8f2e8">n = 908 · horizon 3</text> </g> <line x1="46" y1="228" x2="422" y2="228" stroke="#9e3b26" stroke-width="1.4"/> <text x="234" y="248" text-anchor="middle" font-family="Public Sans" font-size="11" fill="#9e3b26">indiscernables sur la figure · seul (c) est une mesure</text> </svg>