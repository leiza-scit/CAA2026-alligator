<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 700 245" role="img" aria-label="Une matrice de présence-absence où un site ne présente qu’un type, à côté d’un axe de rangs où un groupe ne tient qu’un rang"> <text x="20" y="24" font-family="Public Sans" font-size="11.5" font-weight="600" fill="#1b2430">Dans l’analyse des correspondances</text> <text x="380" y="24" font-family="Public Sans" font-size="11.5" font-weight="600" fill="#1b2430">Dans le panneau de variance</text> <line x1="352" y1="34" x2="352" y2="190" stroke="#e2ddd1"/> <text x="200" y="46" text-anchor="middle" font-family="Public Sans" font-size="9.5" fill="#8a8272">types présents →</text> <rect x="120" y="56" width="18" height="18" fill="#46525f"/> <rect x="146" y="56" width="18" height="18" fill="#46525f"/> <rect x="172" y="56" width="18" height="18" fill="#46525f"/> <rect x="198" y="56" width="18" height="18" fill="#ffffff" stroke="#d9d3c6"/> <rect x="224" y="56" width="18" height="18" fill="#46525f"/> <rect x="120" y="80" width="18" height="18" fill="#ffffff" stroke="#d9d3c6"/> <rect x="146" y="80" width="18" height="18" fill="#46525f"/> <rect x="172" y="80" width="18" height="18" fill="#46525f"/> <rect x="198" y="80" width="18" height="18" fill="#46525f"/> <rect x="224" y="80" width="18" height="18" fill="#ffffff" stroke="#d9d3c6"/> <rect x="120" y="104" width="18" height="18" fill="#46525f"/> <rect x="146" y="104" width="18" height="18" fill="#ffffff" stroke="#d9d3c6"/> <rect x="172" y="104" width="18" height="18" fill="#46525f"/> <rect x="198" y="104" width="18" height="18" fill="#46525f"/> <rect x="224" y="104" width="18" height="18" fill="#46525f"/> <rect x="120" y="128" width="18" height="18" fill="#9e3b26"/> <rect x="146" y="128" width="18" height="18" fill="#ffffff" stroke="#d9d3c6"/> <rect x="172" y="128" width="18" height="18" fill="#ffffff" stroke="#d9d3c6"/> <rect x="198" y="128" width="18" height="18" fill="#ffffff" stroke="#d9d3c6"/> <rect x="224" y="128" width="18" height="18" fill="#ffffff" stroke="#d9d3c6"/> <text x="112" y="69" text-anchor="end" font-family="Public Sans" font-size="10" fill="#46525f">site A</text> <text x="112" y="93" text-anchor="end" font-family="Public Sans" font-size="10" fill="#46525f">site B</text> <text x="112" y="117" text-anchor="end" font-family="Public Sans" font-size="10" fill="#46525f">site C</text> <text x="112" y="141" text-anchor="end" font-family="Public Sans" font-size="10" fill="#9e3b26">Trèves-Petrisberg</text> <rect x="114" y="126" width="132" height="22" fill="none" stroke="#9e3b26" stroke-width="1.2"/> <g font-family="Public Sans" font-size="10" fill="#46525f"> <text x="20" y="168">une ligne à une seule marque n’a aucune co-occurrence ;</text> <text x="20" y="182">l’analyse n’a rien contre quoi la positionner</text> </g> <g stroke="#e2ddd1"> <line x1="440" y1="50" x2="440" y2="128"/><line x1="510" y1="50" x2="510" y2="128"/><line x1="580" y1="50" x2="580" y2="128"/> </g> <line x1="400" y1="128" x2="620" y2="128" stroke="#46525f"/> <circle cx="510" cy="58" r="5" fill="#2ca02c"/><circle cx="510" cy="72" r="5" fill="#2ca02c"/><circle cx="510" cy="86" r="5" fill="#2ca02c"/><circle cx="510" cy="100" r="5" fill="#2ca02c"/> <text x="510" y="146" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#46525f">Service II · rang 1</text> <g font-family="Public Sans" font-size="10" fill="#46525f"> <text x="380" y="168">tous les tessons portent un seul rang ;</text> <text x="380" y="182">il n’y a aucun contraste dont prendre la variance</text> </g> <line x1="20" y1="204" x2="680" y2="204" stroke="#d9d3c6"/> <text x="350" y="226" text-anchor="middle" font-family="Public Sans" font-size="11" fill="#9e3b26">le même fait structurel à deux échelles — une catégorie unique ne laisse rien à comparer</text> </svg>